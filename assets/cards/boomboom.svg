.b6{transform:scaleY(0.58);animation:bb6 1.05s ease-in-out infinite alternate}.m6{animation:mm6 1.05s ease-in-out infinite alternate}@keyframes bb6{from{transform:scaleY(0.58)}to{transform:scaleY(0.26)}}@keyframes mm6{from{transform:translateY(0)}to{transform:translateY(16.0px)}}
