<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 412 190" role="img" aria-label="BoomBoom: A yellow music player for iPhone with a real equaliser, amplifier and Spatial mode.">
<title>BoomBoom: A yellow music player for iPhone with a real equaliser, amplifier and Spatial mode.</title>
<defs></defs>
<style>
