.b3{transform:scaleY(0.5);animation:bb3 0.95s ease-in-out infinite alternate}.m3{animation:mm3 0.95s ease-in-out infinite alternate}@keyframes bb3{from{transform:scaleY(0.5)}to{transform:scaleY(0.96)}}@keyframes mm3{from{transform:translateY(0)}to{transform:translateY(-23.0px)}}
