<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 89 36" role="img" aria-label="email link">
<title>email link</title>
<style>
text{font-family:ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, &quot;Liberation Mono&quot;, &quot;DejaVu Sans Mono&quot;, monospace;font-size:13px;font-variant-ligatures:none}
.halo{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-in-out infinite}
