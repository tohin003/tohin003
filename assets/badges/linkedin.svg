<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 113 36" role="img" aria-label="linkedin link">
<title>linkedin link</title>
<style>
text{font-family:ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, &quot;Liberation Mono&quot;, &quot;DejaVu Sans Mono&quot;, monospace;font-size:13px;font-variant-ligatures:none}
